services:
  - type: web
    name: kord-bot
    repo: https://github.com/M3264/Kord-Ai.git
    branch: master
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    autoDeploy: true

    envVars:
      - key: SESSION_ID
        sync: false

      - key: OWNER_NUMBER
        value: "2349018949706"

      - key: WORKTYPE
        value: "private"

      - key: PREFIX
        value: "[.? *]"

      - key: TIMEZONE
        value: "Africa/Lagos"

      - key: OWNER_NAME
        value: "lordaura"

      - key: BOT_NAME
        value: "kord ai"

      - key: RENDER_API_KEY
        sync: false